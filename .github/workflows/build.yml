name: Build RRDMP (original devkitSH4)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install original devkitSH4 + libdataplus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sdk"
          curl -fsSL --retry 3 https://github.com/MaxSignal/buildscripts/releases/download/Linux/devkitPro.tar.gz | tar xzf - -C "$RUNNER_TEMP/sdk"
          test -x "$RUNNER_TEMP/sdk/devkitPro/devkitSH4/bin/sh-elf-gcc"
      - name: Build and verify Japanese / Chinese RRDMP packages
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO="$RUNNER_TEMP/sdk/devkitPro"
          export DEVKITSH4="$DEVKITPRO/devkitSH4"
          export PATH="$DEVKITPRO/tools/bin:$DEVKITSH4/bin:$PATH"
          make clean
          make app
          for region in ja cn; do
            test -s "build/$region/RRDMP/rrdmp.d01"
            test -s "build/$region/RRDMP/diction.htm"
            test -f "build/$region/RRDMP/fileinfo.cji"
            grep -Fl rrdmp.d01 "build/$region/RRDMP"/inf*.htm
          done
          cmp build/ja/RRDMP/rrdmp.d01 build/cn/RRDMP/rrdmp.d01
          file rrdmp.elf build/ja/RRDMP/rrdmp.d01
          echo "Build passed; device-specific memory mapping unverified" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rrdmp-ja
          path: build/ja/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rrdmp-cn
          path: build/cn/
          if-no-files-found: error
